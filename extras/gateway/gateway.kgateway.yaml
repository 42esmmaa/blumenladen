# kubectl apply -f gateway.kgateway.yaml
# kubectl describe Gateway kgateway -n kgateway-system
# kubectl delete -f gateway.kgateway.yaml

# https://kgateway.dev/docs/envoy/latest/install/sample-app/#api-gateway

kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  # Inspektion nach dem Anlegen in Headlamp:
  # Custom Resources > gateway.networking.k8s.io > Gateway
  name: kgateway
  namespace: kgateway-system
spec:
  # Voraussetzung in Headlamp:
  # Custom Resources > gateway.networking.k8s.io > GatewayClass
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: All
