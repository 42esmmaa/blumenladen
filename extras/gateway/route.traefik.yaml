# kubectl apply -f route.traefik.yaml
# kubectl describe HTTPRoute blumenladen-route -n traefik
# kubectl delete -f route.traefik.yaml

# https://gateway-api.sigs.k8s.io/api-types/httproute
# https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#rewrites
# https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/gateway-api

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blumenladen-route
  namespace: traefik
spec:
  parentRefs:
    # siehe Gateway Name bei CRD von Traefik
    # Headlamp:   Custom Resources > gateway.networking.k8s.io > Gateway
    - name: traefik-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /blumenlaeden
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: blumenladen
          port: 8080
          # KEIN selbst-signiertes Zertifikat bei HTTPS
          #port: 8443
          namespace: acme
