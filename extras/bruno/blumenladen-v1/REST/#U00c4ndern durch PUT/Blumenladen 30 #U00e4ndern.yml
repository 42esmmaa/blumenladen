info:
  name: Blumenladen 30 ändern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{apiUrl}}/:id"
  headers:
    - name: If-Match
      value: '"0"'
    - name: X-Version
      value: 1.0.0
  params:
    - name: id
      value: 00000030-0000-7000-9000-000000000000
      type: path
  body:
    type: json
    data: |-
      {
          "name": "Blumen Müller Neu",
          "adresse": "Neuer Weg 5, 76133 Karlsruhe",
          "telefonnummer": "+49 721 999999",
          "open": false,
          "oeffnungszeit": "09:00:00",
          "schliesszeit": "17:00:00",
          "leiter": {
              "vorname": "Anna",
              "nachname": "Schmidt",
              "telefonnummer": "+49 721 888888"
          }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
