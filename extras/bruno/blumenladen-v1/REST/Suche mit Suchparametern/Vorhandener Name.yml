info:
  name: Vorhandener Name
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}?name=Blumenladen Eve"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: name
      value: Blumenladen Eve
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body: Nachname "Alpha" und ID', () => {
          res.getBody()
            .forEach(blumenladen => {
              const { nachname, id } = blumenladen;
              expect(nachname).to.be.equal('Alice');
              expect(id).to.be.a('string').that.matches(/[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/u);
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
