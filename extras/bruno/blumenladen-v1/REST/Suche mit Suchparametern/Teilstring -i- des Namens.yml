info:
  name: Teilstring "i" des Namens
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}?name=a"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: name
      value: a
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body: Nachname enthaelt "i" und ID vorhanden', () => {
          res.getBody()
            .forEach(blumenladen => {
              const { nachname, id } = blumenladen;
              expect(nachname).to.be.a('string');
              expect(nachname.toLowerCase()).to.include('i');
              expect(id).to.be.a('string').that.matches(/[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/u);
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
