info:
  name: Vorhandene ID 1...1 mit blumen=true
  type: http
  seq: 7

http:
  method: GET
  url: "{{apiUrl}}/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: id
      value: 10000001-0000-7000-8000-000000000000
      type: path
    - name: blumen
      value: "true"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.id
      operator: eq
      value: 10000001-0000-7000-8000-000000000000
    - expression: res.body.blumen
      operator: isArray
    - expression: res.body.blumen
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
