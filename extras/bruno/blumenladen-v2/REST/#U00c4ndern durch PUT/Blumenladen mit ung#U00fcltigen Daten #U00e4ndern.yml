info:
  name: Blumenladen mit ungültigen Daten ändern
  type: http
  seq: 5

http:
  method: PUT
  url: "{{apiUrl}}/:id"
  headers:
    - name: If-Match
      value: '"0"'
    - name: X-Version
      value: 1.0.0
  params:
    - name: id
      value: 10000003-0000-7000-8000-000000000000
      type: path
  body:
    type: json
    data: |-
      {
          "name": "",
          "adresse": "",
          "telefonnummer": "abc",
          "open": false,
          "oeffnungszeit": "09:00:00",
          "schliesszeit": "17:00:00",
          "leiter": {
              "vorname": "",
              "nachname": "",
              "telefonnummer": "xyz"
          }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "422"
    - expression: res.body.title
      operator: eq
      value: Unprocessable Content
    - expression: res.body.instance
      operator: matches
      value: /api/10000003-0000-7000-8000-000000000000$
    - expression: res.body.detail
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
